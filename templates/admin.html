<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Users — CyberGuard AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" href="{{ material_symbols_url }}" as="style" onload="this.rel='stylesheet'" />
  <noscript><link href="{{ material_symbols_url }}" rel="stylesheet" /></noscript>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="premium-page">
  <nav class="navbar premium-navbar">
    <div class="nav-inner premium-nav-inner" style="display:flex; align-items:center; justify-content:space-between; gap:16px;">
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="burger-btn premium-icon-btn" id="burgerBtn" type="button" aria-label="Menu" onclick="toggleBurgerMenu()">
          <span class="material-symbols-outlined">menu</span>
        </button>

        <a href="{{ url_for('home') }}" class="nav-logo premium-logo">
          <img src="{{ url_for('static', filename='logo.cybergard.webp') }}" alt="CyberGuard AI" height="44" style="object-fit:contain;">
          <span class="nav-logo-text">CyberGuard <span style="font-weight:900;opacity:0.85;">AI</span></span>
        </a>
      </div>

      <div class="nav-actions premium-actions" style="display:flex; align-items:center; gap:8px;">
        <button type="button" class="premium-icon-btn" onclick="location.reload()" aria-label="Refresh page" title="Refresh">
          <span class="material-symbols-outlined">refresh</span>
        </button>
        <button type="button" class="premium-icon-btn" onclick="signOut()" aria-label="Sign out" title="Sign out">
          <span class="material-symbols-outlined">logout</span>
        </button>
      </div>
    </div>

    <div class="burger-menu" id="burgerMenu">
      <a href="{{ url_for('admin') }}" class="burger-link active">
        <span class="material-symbols-outlined">security</span>
        Admin
      </a>
      <a href="{{ url_for('dashboard') }}" class="burger-link">
        <span class="material-symbols-outlined">dashboard</span>
        Dashboard
      </a>
      <a href="{{ url_for('home') }}" class="burger-link">
        <span class="material-symbols-outlined">home</span>
        Home
      </a>
      <a href="{{ url_for('academy') }}" class="burger-link">
        <span class="material-symbols-outlined">school</span>
        Academy
      </a>
      <a href="{{ url_for('history') }}" class="burger-link">
        <span class="material-symbols-outlined">history</span>
        History
      </a>
    </div>
  </nav>

  <div class="page-section">
    <div class="admin-panel-header">
      <div class="admin-panel-title-wrap">
        <span class="admin-panel-title">ADMIN PANEL</span>
        <span class="material-symbols-outlined admin-panel-shield">security</span>
        <span class="admin-panel-role">admin</span>
      </div>
    </div>

    <div class="admin-panel-badge-row">
      <span class="material-symbols-outlined">dashboard</span>
      <span>Dashboard</span>
    </div>

    <div class="history-card" style="padding: 32px; overflow-x:auto; margin-bottom: 32px; margin-top: 24px;">
      <table class="history-table" style="width:100%; border-spacing:0;">
        <thead>
          <tr>
            <th>Email</th>
            <th>Clerk User ID</th>
            <th>Scans</th>
            <th>Created At</th>
          </tr>
        </thead>
        <tbody id="adminTableBody">
          <tr><td colspan="4" style="padding: 18px; text-align:center; color: var(--text-muted);">Loading users…</td></tr>
        </tbody>
      </table>
      <div id="adminEmpty" class="history-empty" style="display:none; margin-top:20px;">
        <p style="font-size:1rem; color: var(--text-sub);">No synced Clerk users yet.</p>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-inner">
      <span class="footer-logo">CyberGuard AI</span>
      <span class="footer-copy">© 2026 CyberGuard AI. All rights reserved.</span>
    </div>
  </footer>

  <script async crossorigin="anonymous" data-clerk-publishable-key="{{ clerk_publishable_key }}" src="{{ clerk_js_url }}"></script>
  <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
  <script>
    async function loadAdminPage() {
      try {
        if (!window.Clerk) return;
        await window.Clerk.load();
        const user = window.Clerk.user;
        if (!user || !user.primaryEmailAddress) {
          window.location.href = '{{ url_for("signin") }}';
          return;
        }

        await fetch('/api/sync-user', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: user.id, email: user.primaryEmailAddress.emailAddress }),
        });

        const response = await fetch('/api/admin/users');
        const payload = await response.json();

        const body = document.getElementById('adminTableBody');
        const empty = document.getElementById('adminEmpty');

        if (!payload.success || !payload.users || payload.users.length === 0) {
          body.innerHTML = '';
          empty.style.display = 'block';
          return;
        }

        empty.style.display = 'none';
        body.innerHTML = '';

        payload.users.forEach(userRow => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${escapeHtml(userRow.email)}</td>
            <td style="word-break: break-all; font-size: 0.84rem;">${escapeHtml(userRow.clerk_user_id)}</td>
            <td>${userRow.scan_count}</td>
            <td>${escapeHtml(userRow.created_at)}</td>
          `;
          body.appendChild(tr);
        });
      } catch (err) {
        console.error('Admin page failed to load:', err);
        const body = document.getElementById('adminTableBody');
        body.innerHTML = '<tr><td colspan="4" style="padding:18px;text-align:center;color:var(--red);">Failed to load admin users.</td></tr>';
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text ?? '';
      return div.innerHTML;
    }

    document.addEventListener('DOMContentLoaded', loadAdminPage);
  </script>
</body>
</html>
